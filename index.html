<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta — overridden per-route by react-helmet-async -->
    <title>Songtai Life — Premium Wellness &amp; MLM Platform, Cameroon</title>
    <meta name="description" content="Health. Opportunity. Prosperity. Premium natural products formulated with West African botanical heritage, unlocking sovereign economic independence for families across Cameroon." />

    <!-- Canonical (fallback — react-helmet-async sets the real one per page) -->
    <link rel="canonical" href="https://songtailife.cm/" />

    <!-- Open Graph fallbacks — social scrapers that don't execute JS see these -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Songtai Life" />
    <meta property="og:title"       content="Songtai Life — Premium Wellness &amp; MLM Platform, Cameroon" />
    <meta property="og:description" content="Health. Opportunity. Prosperity. Premium natural products formulated with West African botanical heritage, unlocking sovereign economic independence for families across Cameroon." />
    <meta property="og:url"         content="https://songtailife.cm/" />
    <meta property="og:image"       content="https://songtailife.cm/og-default.jpg" />
    <meta property="og:locale"      content="en_CM" />

    <!-- Twitter Card fallbacks -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Songtai Life — Premium Wellness &amp; MLM Platform, Cameroon" />
    <meta name="twitter:description" content="Health. Opportunity. Prosperity. Premium natural products formulated with West African botanical heritage." />
    <meta name="twitter:image"       content="https://songtailife.cm/og-default.jpg" />

    <!-- hreflang fallbacks -->
    <link rel="alternate" hreflang="en"        href="https://songtailife.cm/?lang=en" />
    <link rel="alternate" hreflang="fr"        href="https://songtailife.cm/?lang=fr" />
    <link rel="alternate" hreflang="x-default" href="https://songtailife.cm/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon"  href="/favicon.ico" />
    <link rel="apple-touch-icon"          href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Display: Fraunces (variable optical-size serif) — chosen for its quiet gravitas and
      distinctive "worm" axis personality. At heavy weights it reads as premium without
      the pharmacopoeia-cliché of high-contrast Didone serifs. Supports EN & FR accents.
      Body/UI: Inter — humanist sans with excellent accented-character support (é è à ô ç œ).
      Mono: JetBrains Mono — admin code/metric displays only.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
